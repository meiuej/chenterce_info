<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Сайт «Центр Ц.» временно находится на реконструкции.">
  <title>Центр Ц. — сайт на реконструкции</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --paper: #211d16; --paper-deep: #16140f; --ink: #e7ddc9; --ink-soft: #bcae96; --line: rgba(218, 198, 163, .3); --seal: #d49b86; }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 22px; color: var(--ink); font-family: Manrope, Arial, sans-serif; background: radial-gradient(circle at 16% 10%, rgba(138, 111, 65, .16), transparent 25rem), radial-gradient(circle at 82% 86%, rgba(74, 52, 27, .24), transparent 29rem), var(--paper-deep); }
    main { width: min(100%, 680px); padding: clamp(40px, 8vw, 78px) clamp(24px, 7vw, 72px); text-align: center; background: var(--paper); border: 1px solid var(--line); box-shadow: inset 0 0 0 5px rgba(212, 155, 134, .05); }
    .label { margin: 0 0 22px; color: var(--seal); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Literata, Georgia, serif; font-size: clamp(44px, 9vw, 76px); font-weight: 600; line-height: .98; letter-spacing: -.06em; }
    p { max-width: 480px; margin: 24px auto 0; color: var(--ink-soft); font-size: clamp(16px, 2vw, 19px); line-height: 1.6; }
    a { display: inline-flex; align-items: center; justify-content: center; margin-top: 32px; padding: 15px 21px; color: var(--paper-deep); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-decoration: none; text-transform: uppercase; background: var(--seal); transition: transform 180ms ease, background-color 180ms ease; }
    a:hover, a:focus-visible { background: var(--ink); transform: translateY(-2px); outline: none; }
    .socials { margin-top: 42px; padding-top: 24px; border-top: 1px solid var(--line); }
    .socials__title { margin: 0 0 14px; color: var(--ink-soft); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .socials__links { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
    .socials__link { margin: 0; padding: 10px 14px; color: var(--ink); font-size: 11px; letter-spacing: .04em; text-transform: none; background: transparent; border: 1px solid var(--line); }
    .socials__link:hover, .socials__link:focus-visible { color: var(--paper-deep); background: var(--seal); }
    @media (max-width: 480px) {
      body { display: block; padding: 12px; }
      main { min-height: calc(100vh - 24px); display: flex; flex-direction: column; justify-content: center; padding: 36px 20px; }
      .label { margin-bottom: 18px; font-size: 10px; }
      h1 { font-size: clamp(42px, 14vw, 58px); }
      p { margin-top: 20px; font-size: 16px; }
      main > a { width: 100%; min-height: 52px; margin-top: 28px; }
      .socials { margin-top: 32px; padding-top: 20px; }
      .socials__links { display: grid; grid-template-columns: 1fr; gap: 8px; }
      .socials__link { width: 100%; min-height: 44px; padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="label">Центр Ц.</p>
    <h1>Сайт на<br>реконструкции</h1>
    <p>Мы обновляем сайт, чтобы он стал удобнее и полезнее. Пока что вы можете поддержать работу независимой редакции.</p>
    <a href="centre-ts-donate.html">Перейти к поддержке →</a>
    <section class="socials" aria-labelledby="socials-title">
      <h2 class="socials__title" id="socials-title">Мы в соцсетях</h2>
      <div class="socials__links">
        <a class="socials__link" href="https://t.me/cencece" target="_blank" rel="noopener noreferrer">Telegram · @cencece</a>
        <a class="socials__link" href="https://www.tiktok.com/@mediacentr.press?_r=1&amp;_t=ZN-98F9e5GydUs" target="_blank" rel="noopener noreferrer">TikTok · @mediacentr.press</a>
      </div>
    </section>
  </main>
</body>
</html>
